version: "3.8"

services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: autswot-admin
    ports:
      - "3002:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - API_UPSTREAM_HOST=host.docker.internal
    restart: unless-stopped
    networks:
      - autswot-network

networks:
  autswot-network:
    driver: bridge

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="AutSWOT logo">
  <defs>
    <!-- Gradiente do texto -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB3B8C"/>
      <stop offset="100%" stop-color="#2C8FBF"/>
    </linearGradient>

    <!-- Estilos gerais -->
    <style>
      .word {
        fill: url(#textGrad);
        font-weight: 700;
        letter-spacing: 1px;
      }
      /* Ajuste a família de fontes para ficar mais próximo do seu original */
      .word { font-family: 'Poppins', 'Nunito Sans', 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
      .left-dot { fill: #C24A9A; }
      .left-line { stroke: #C24A9A; stroke-width: 3; stroke-linecap: round; }
      .right-dot { fill: #2CA9C9; }
      .right-line { stroke: #2CA9C9; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Texto principal -->
  <g transform="translate(220,140)">
    <text class="word" x="0" y="260" font-size="260">AutSWOT</text>
  </g>

  <!-- Rede esquerda (estilização simplificada) -->
  <g transform="translate(40,250) scale(1)">
    <!-- linhas -->
    <path class="left-line" d="M120,160 L180,120 L240,160 L210,230 L140,210 Z"/>
    <path class="left-line" d="M180,120 L150,70 L100,110 L120,160"/>
    <path class="left-line" d="M240,160 L300,190 L260,240 L210,230"/>
    <path class="left-line" d="M140,210 L90,260 L60,220 L100,110"/>
    <!-- pontos -->
    <circle class="left-dot" cx="150" cy="70" r="6"/>
    <circle class="left-dot" cx="100" cy="110" r="7"/>
    <circle class="left-dot" cx="180" cy="120" r="8"/>
    <circle class="left-dot" cx="120" cy="160" r="7"/>
    <circle class="left-dot" cx="240" cy="160" r="7"/>
    <circle class="left-dot" cx="210" cy="230" r="7"/>
    <circle class="left-dot" cx="140" cy="210" r="7"/>
    <circle class="left-dot" cx="300" cy="190" r="6"/>
    <circle class="left-dot" cx="260" cy="240" r="6"/>
    <circle class="left-dot" cx="90" cy="260" r="6"/>
    <circle class="left-dot" cx="60" cy="220" r="5"/>
    <!-- dispersos -->
    <circle class="left-dot" cx="18" cy="220" r="5"/>
    <circle class="left-dot" cx="20" cy="310" r="4"/>
    <circle class="left-dot" cx="340" cy="215" r="5"/>
    <circle class="left-dot" cx="325" cy="145" r="4"/>
  </g>

  <!-- Rede direita (espelhada/variação) -->
  <g transform="translate(1235,160) scale(1)">
    <!-- linhas -->
    <path class="right-line" d="M120,160 L180,120 L240,160 L210,230 L140,210 Z"/>
    <path class="right-line" d="M180,120 L150,70 L100,110 L120,160"/>
    <path class="right-line" d="M240,160 L300,190 L260,240 L210,230"/>
    <path class="right-line" d="M140,210 L90,260 L60,220 L100,110"/>
    <!-- pontos -->
    <circle class="right-dot" cx="150" cy="70" r="6"/>
    <circle class="right-dot" cx="100" cy="110" r="7"/>
    <circle class="right-dot" cx="180" cy="120" r="8"/>
    <circle class="right-dot" cx="120" cy="160" r="7"/>
    <circle class="right-dot" cx="240" cy="160" r="7"/>
    <circle class="right-dot" cx="210" cy="230" r="7"/>
    <circle class="right-dot" cx="140" cy="210" r="7"/>
    <circle class="right-dot" cx="300" cy="190" r="6"/>
    <circle class="right-dot" cx="260" cy="240" r="6"/>
    <circle class="right-dot" cx="90" cy="260" r="6"/>
    <circle class="right-dot" cx="60" cy="220" r="5"/>
    <!-- dispersos -->
    <circle class="right-dot" cx="22" cy="10" r="4"/>
    <circle class="right-dot" cx="80" cy="0" r="5"/>
    <circle class="right-dot" cx="140" cy="-20" r="4"/>
    <circle class="right-dot" cx="260" cy="-10" r="5"/>
    <circle class="right-dot" cx="330" cy="20" r="4"/>
    <circle class="right-dot" cx="355" cy="55" r="5"/>
  </g>
</svg>